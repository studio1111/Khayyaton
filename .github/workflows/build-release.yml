name: Build Release AAB and APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: khayyaton-production-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Khayyaton keystore
        run: echo "${{ secrets.KHAYYATON_KEYSTORE_BASE64 }}" | base64 -d > khayyaton.jks

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/khayyaton.jks
          STORE_PASSWORD: ${{ secrets.KHAYYATON_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KHAYYATON_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --stacktrace --no-daemon

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/khayyaton.jks
          STORE_PASSWORD: ${{ secrets.KHAYYATON_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KHAYYATON_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify AAB signature
        run: jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Verify APK signature
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/apk/release/app-release.apk
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v6
        with:
          name: khayyaton-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: khayyaton-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create Source ZIP
        if: github.event_name != 'pull_request'
        run: git archive --format=zip --output="Khayyaton-Source-${GITHUB_SHA::7}.zip" "${GITHUB_SHA}"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "release-${GITHUB_RUN_NUMBER}" --target "${GITHUB_SHA}" --title "Khayyaton Release ${GITHUB_RUN_NUMBER}" --notes "Production release built from commit ${GITHUB_SHA}. Includes signed AAB, signed APK, and complete source ZIP." "app/build/outputs/bundle/release/app-release.aab#Khayyaton AAB" "app/build/outputs/apk/release/app-release.apk#Khayyaton APK" "Khayyaton-Source-${GITHUB_SHA::7}.zip#Khayyaton Source ZIP"

      - name: Verify release identity
        run: |
          echo "=== Release identity ==="
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab | grep -E "X.509|SHA256 digest|jar verified" | head -20 || true
          if command -v apkanalyzer >/dev/null 2>&1; then
            apkanalyzer manifest application-id app/build/outputs/bundle/release/app-release.aab || true
          fi

      - name: Remove keystore
        if: always()
        run: rm -f khayyaton.jks
