name: Build Release AAB and APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: khayyaton-production-release
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Khayyaton keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.KHAYYATON_KEYSTORE_BASE64 }}"
          echo "${{ secrets.KHAYYATON_KEYSTORE_BASE64 }}" | base64 -d > khayyaton.jks
          test -s khayyaton.jks

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        timeout-minutes: 10
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/khayyaton.jks
          STORE_PASSWORD: ${{ secrets.KHAYYATON_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KHAYYATON_KEY_PASSWORD }}
        timeout-minutes: 20
        run: gradle :app:bundleRelease --stacktrace --no-daemon

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/khayyaton.jks
          STORE_PASSWORD: ${{ secrets.KHAYYATON_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KHAYYATON_KEY_PASSWORD }}
        timeout-minutes: 15
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify AAB signature
        run: |
          set -euo pipefail
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Verify APK signature
        run: |
          set -euo pipefail
          jarsigner -verify -verbose -certs app/build/outputs/apk/release/app-release.apk
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          fi

      - name: Create Source ZIP
        run: |
          set -euo pipefail
          git archive --format=zip --output="Khayyaton-Source-${GITHUB_SHA}.zip" "${GITHUB_SHA}"
          test -s "Khayyaton-Source-${GITHUB_SHA}.zip"

      - name: Verify source archive identity
        run: |
          set -euo pipefail
          git archive --format=tar "${GITHUB_SHA}" | tar -tf - >/dev/null

      - name: Create SHA-256 checksums
        run: |
          set -euo pipefail
          sha256sum             app/build/outputs/bundle/release/app-release.aab             app/build/outputs/apk/release/app-release.apk             "Khayyaton-Source-${GITHUB_SHA}.zip"             > "Khayyaton-SHA256-${GITHUB_SHA}.txt"
          test -s "Khayyaton-SHA256-${GITHUB_SHA}.txt"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v6
        with:
          name: khayyaton-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: khayyaton-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Source ZIP artifact
        uses: actions/upload-artifact@v6
        with:
          name: khayyaton-source
          path: Khayyaton-Source-${{ github.sha }}.zip
          if-no-files-found: error

      - name: Upload SHA-256 checksum artifact
        uses: actions/upload-artifact@v6
        with:
          name: khayyaton-release-checksums
          path: Khayyaton-SHA256-${{ github.sha }}.txt
          if-no-files-found: error

      - name: Remove previous GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              gh release delete "$tag" --yes --cleanup-tag || true
            done

      - name: Publish GitHub Release 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "release-1"             --target "${GITHUB_SHA}"             --title "Khayyaton Release 1"             --notes "نسخه نهایی خیاطان، شماره ۱. ساخته‌شده از commit ${GITHUB_SHA}. شامل AAB امضاشده، APK امضاشده، سورس کامل و SHA-256."             "app/build/outputs/bundle/release/app-release.aab#Khayyaton AAB"             "app/build/outputs/apk/release/app-release.apk#Khayyaton APK"             "Khayyaton-Source-${GITHUB_SHA}.zip#Khayyaton Source ZIP"             "Khayyaton-SHA256-${GITHUB_SHA}.txt#Khayyaton SHA-256"

      - name: Keep only this final workflow run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --repo "${GITHUB_REPOSITORY}" --limit 1000 --json databaseId --jq '.[].databaseId' |
            while IFS= read -r run_id; do
              [ -z "$run_id" ] && continue
              [ "$run_id" = "${GITHUB_RUN_ID}" ] && continue
              gh run delete "$run_id" --repo "${GITHUB_REPOSITORY}" || true
            done

      - name: Remove keystore
        if: always()
        run: rm -f khayyaton.jks
