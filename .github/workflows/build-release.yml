name: Build Release AAB and APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-release.yml'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create .env file
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Decode keystore
        run: echo "${{ secrets.KHAYYATON_KEYSTORE_BASE64 }}" | base64 -d > khayyaton.jks

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate gradlew if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/khayyaton.jks
          STORE_PASSWORD: ${{ secrets.KHAYYATON_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KHAYYATON_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/khayyaton.jks
          STORE_PASSWORD: ${{ secrets.KHAYYATON_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KHAYYATON_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify AAB signature
        run: jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v6
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
