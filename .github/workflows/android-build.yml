name: Android Build Check

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "app/**"
      - "gradle/**"
      - ".github/workflows/android-build.yml"
      - ".github/workflows/build-release.yml"

# Release validation workflow.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkeypair -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        run: gradle testFreeDebugUnitTest testPaidDebugUnitTest --stacktrace --no-daemon

      - name: Assemble debug APK
        run: gradle assembleFreeDebug assemblePaidDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: khayyaton-edition-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
