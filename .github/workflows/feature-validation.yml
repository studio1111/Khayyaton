name: Khayyaton Feature Validation

on:
  push:
    branches:
      - feature/khayyaton-subscriptions
  pull_request:
    branches:
      - main
      - feature/khayyaton-subscriptions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Create debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkeypair -v -keystore ./debug.keystore               -storepass android -alias androiddebugkey -keypass android               -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: khayyaton-feature-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
