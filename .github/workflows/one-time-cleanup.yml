name: One-time cleanup old builds

on:
  push:
    paths:
      - '.github/workflows/one-time-cleanup.yml'

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs older than 7 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          CUTOFF=$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ')
          gh api --paginate "repos/${{ github.repository }}/actions/runs?per_page=100"             --jq '.workflow_runs[] | select(.created_at < "'"$CUTOFF"'") | .id' |
          while read -r RUN_ID; do
            [ -z "$RUN_ID" ] || gh api --method DELETE "repos/${{ github.repository }}/actions/runs/$RUN_ID"
          done

      - name: Delete artifacts older than 7 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          CUTOFF=$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ')
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100"             --jq '.artifacts[] | select(.created_at < "'"$CUTOFF"'") | .id' |
          while read -r ARTIFACT_ID; do
            [ -z "$ARTIFACT_ID" ] || gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID"
          done

      - name: Remove this one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh api "repos/${{ github.repository }}/contents/.github/workflows/one-time-cleanup.yml" --jq '.sha')
          gh api --method DELETE "repos/${{ github.repository }}/contents/.github/workflows/one-time-cleanup.yml"             -f message='ci: remove one-time build cleanup workflow'             -f sha="$SHA"             -f branch='main'
